<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d4937">
  <title>CANNABIS | カナビス</title>
  <link rel="stylesheet" href="./style.css?v=1.6.1">
  <link rel="manifest" href="./manifest.webmanifest?v=1.6.0">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=1.6.0">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./icons/apple-touch-icon.png?v=1.6.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CANNABIS">
</head>
<body>
  <div id="app">
    <section id="loginView" class="login-screen">
      <div class="login-brand">
        <div class="brand-mark large" aria-hidden="true">
          <svg viewBox="0 0 100 100"><g fill="currentColor">
            <path d="M50 48 C42 31 43 14 50 3 C57 14 58 31 50 48Z"/>
            <path d="M47 51 C27 43 15 31 12 19 C27 22 41 34 50 49Z"/>
            <path d="M53 51 C73 43 85 31 88 19 C73 22 59 34 50 49Z"/>
            <path d="M46 54 C25 55 10 65 3 76 C20 79 38 70 50 53Z"/>
            <path d="M54 54 C75 55 90 65 97 76 C80 79 62 70 50 53Z"/>
            <path d="M48 57 C39 72 39 87 50 98 C61 87 61 72 52 57Z"/>
            <path d="M49 46 L51 94 L48 94Z"/>
          </g></svg>
        </div>
        <div class="brand-name">CANNABIS</div>
        <div class="brand-jp">カ ナ ビ ス</div>
        <p>冷凍設備業務管理システム</p>
      </div>
      <div class="login-card">
        <h1>ログイン</h1>
        <p class="login-help">登録済みのGoogleアカウントでログインしてください。</p>
        <button id="googleLoginButton" class="primary-btn full" type="button">
          Googleアカウントでログイン
        </button>
        <p id="authMessage" class="demo-note hidden" role="status"></p>
      </div>
      <div class="login-foot">CANNABIS BUSINESS MANAGEMENT</div>
    </section>

    <section id="mainView" class="hidden">
      <header class="topbar">
        <button class="icon-btn back-btn hidden" id="backButton" aria-label="戻る">‹</button>
        <div class="top-brand">
          <span class="brand-mark small"><svg viewBox="0 0 100 100"><g fill="currentColor">
            <path d="M50 48 C42 31 43 14 50 3 C57 14 58 31 50 48Z"/>
            <path d="M47 51 C27 43 15 31 12 19 C27 22 41 34 50 49Z"/>
            <path d="M53 51 C73 43 85 31 88 19 C73 22 59 34 50 49Z"/>
            <path d="M46 54 C25 55 10 65 3 76 C20 79 38 70 50 53Z"/>
            <path d="M54 54 C75 55 90 65 97 76 C80 79 62 70 50 53Z"/>
            <path d="M48 57 C39 72 39 87 50 98 C61 87 61 72 52 57Z"/>
            <path d="M49 46 L51 94 L48 94Z"/>
          </g></svg></span>
          <span class="top-brand-title">CANNABIS<small>カナビス</small></span>
        </div>
        <div class="topbar-actions"><span id="syncStatus" class="sync-status">Firebase未接続</span><button id="tvModeButton" class="tv-open-button" type="button">モニター表示 ↗</button></div>
      </header>

      <main id="content" class="content"></main>

      <nav class="bottom-nav" aria-label="メインメニュー">
        <button data-nav="dashboard" class="nav-item active"><span>⌂</span><small>ホーム</small></button>
        <button data-nav="projects" class="nav-item"><span>▣</span><small>案件</small></button>
        <button data-nav="schedule" class="nav-item"><span>▦</span><small>予定</small></button>
        <button data-nav="attendance" class="nav-item"><span>◷</span><small>勤怠</small></button>
        <button data-nav="menu" class="nav-item"><span>☰</span><small>メニュー</small></button>
      </nav>
    </section>
    <div id="toast" class="toast" role="status"></div>
    <dialog id="formDialog" class="form-dialog">
      <form id="entityForm" method="dialog">
        <div class="dialog-head"><h2 id="dialogTitle">登録</h2><button type="button" id="closeDialog" class="icon-btn">×</button></div>
        <div id="dialogFields" class="form-fields"></div>
        <div class="dialog-actions">
          <button type="button" class="secondary-btn" id="cancelDialog">キャンセル</button>
          <button type="submit" class="primary-btn">保存する</button>
        </div>
      </form>
    </dialog>
  </div>
  <script type="module" src="./app.js?v=1.6.1"></script>
</body>
</html>
